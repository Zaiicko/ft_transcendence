# Production stack — https://saveboxd.com
# Differences from the dev compose: no source volumes or hot reload (real
# images built from Dockerfile.prod), frontend compiled and served as static
# files, nginx exposed on 80/443 with Let's Encrypt certificates, certbot
# sidecar auto-renewing them, no Prisma Studio port.
#
# First deployment: ./deploy/init-letsencrypt.sh (issues the initial
# certificate), then: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
      PSN_SERVICE_NPSSO: ${PSN_SERVICE_NPSSO}
      PSN_PROXY_URL: ${PSN_PROXY_URL}
      XBL_API_KEY: ${XBL_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped

  # --- Error monitoring (GlitchTip: self-hosted, Sentry-protocol compatible)
  # -- see monitoring.saveboxd.com in nginx/prod.conf. Reuses the main
  # postgres instance (separate "glitchtip" database, created once by hand —
  # this image doesn't support POSTGRES_MULTIPLE_DATABASES) to avoid running
  # a second Postgres container on a 4GB VPS.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  glitchtip-migrate:
    image: glitchtip/glitchtip:6
    restart: "no"
    command: ./manage.py migrate
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip:6
    restart: unless-stopped
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      GLITCHTIP_DOMAIN: https://monitoring.saveboxd.com
      DEFAULT_FROM_EMAIL: ${MAIL_FROM}
      EMAIL_URL: smtp://${SMTP_USER}:${SMTP_PASS}@${SMTP_HOST}:${SMTP_PORT}
      # Only the owner (created via `createsuperuser`) can sign in — this
      # dashboard exposes stack traces, not something to leave self-serve.
      ENABLE_OPEN_USER_REGISTRATION: "false"
      CELERY_WORKER_AUTOSCALE: "1,1"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  glitchtip-worker:
    image: glitchtip/glitchtip:6
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      GLITCHTIP_DOMAIN: https://monitoring.saveboxd.com
      DEFAULT_FROM_EMAIL: ${MAIL_FROM}
      EMAIL_URL: smtp://${SMTP_USER}:${SMTP_PASS}@${SMTP_HOST}:${SMTP_PORT}
      CELERY_WORKER_AUTOSCALE: "1,1"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - glitchtip-web
    # Reload every 6h so nginx picks up certificates renewed by certbot
    command: sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  # Checks twice a day whether the certificate is due for renewal (Let's
  # Encrypt certs last 90 days; certbot renews within 30 days of expiry)
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  postgres_data:
  backend_uploads:
  certbot_conf:
  certbot_www:
