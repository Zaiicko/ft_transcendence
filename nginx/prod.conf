# Production reverse proxy — the only public entry point (80/443).
# Browser -> nginx -> backend / frontend (plain HTTP inside the docker network).
# Certificates come from Let's Encrypt (see certbot service + deploy/init-letsencrypt.sh).

# HTTP: answer ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name saveboxd.com www.saveboxd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://saveboxd.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name saveboxd.com www.saveboxd.com;

    ssl_certificate     /etc/letsencrypt/live/saveboxd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saveboxd.com/privkey.pem;

    # Canonical host: fold www. into the bare domain (cookies + OAuth callbacks
    # are registered on saveboxd.com only)
    if ($host = www.saveboxd.com) {
        return 301 https://saveboxd.com$request_uri;
    }

    # Default 1MB is too small for avatar uploads (POST /api/users/me/avatar)
    client_max_body_size 5m;

    # REST API -> NestJS
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Images IGDB re-servies en même origine : le CDN n'envoie pas de header
    # CORS, or l'extraction de couleur dominante lit les pixels en canvas —
    # interdit sur une image cross-origin ("tainted canvas")
    location /igdb/ {
        proxy_pass https://images.igdb.com/;
        proxy_set_header Host images.igdb.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
    }

    # WebSockets (presence, chat, notifications)
    location /socket.io {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # default 60s would kill an idle WS; Socket.IO pings every 25s but
        # a missed ping (laptop sleep, GC pause) must not drop the socket
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else -> static SPA bundle
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
