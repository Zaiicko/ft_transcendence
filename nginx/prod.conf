# Production reverse proxy — the only public entry point (80/443).
# Browser -> nginx -> backend / frontend (plain HTTP inside the docker network).
# Certificates come from Let's Encrypt (see certbot service + deploy/init-letsencrypt.sh).

# Server-rendered Open Graph cards for link-preview crawlers (Discord, X,
# Slack, iMessage, ...) — see backend/src/og. Those bots never execute JS, so
# the SPA (which sets no per-page meta at all) is invisible to them; real
# browsers are untouched and keep going straight to the SPA below.
map $http_user_agent $og_bot {
    default 0;
    "~*Discordbot" 1;
    "~*Twitterbot" 1;
    "~*facebookexternalhit" 1;
    "~*Slackbot" 1;
    "~*LinkedInBot" 1;
    "~*TelegramBot" 1;
    "~*WhatsApp" 1;
    "~*SkypeUriPreview" 1;
    "~*redditbot" 1;
    "~*Applebot" 1;
    "~*vkShare" 1;
    "~*W3C_Validator" 1;
}

# The matching backend OG path for a shareable URL, derived from $uri via
# `map` (not location-regex captures — those don't reliably survive into an
# `if` block, a well-known nginx gotcha). Empty string on no match.
map $uri $og_path {
    default "";
    / "/api/og/hub";
    /games "/api/og/catalog";
    "~^/(?<og_kind>game|company)/(?<og_id>[0-9]+)/?$" "/api/og/$og_kind/$og_id";
    "~^/u/(?<og_user>[^/]+)/?$" "/api/og/profile/$og_user";
}

# HTTP: answer ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name saveboxd.com www.saveboxd.com monitoring.saveboxd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Preserve $host so monitoring.saveboxd.com redirects to itself, not to
    # the bare domain (canonicalization of www -> bare happens in the 443
    # block below, for saveboxd.com only).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name saveboxd.com www.saveboxd.com;

    ssl_certificate     /etc/letsencrypt/live/saveboxd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saveboxd.com/privkey.pem;

    # Canonical host: fold www. into the bare domain (cookies + OAuth callbacks
    # are registered on saveboxd.com only)
    if ($host = www.saveboxd.com) {
        return 301 https://saveboxd.com$request_uri;
    }

    # Default 1MB is too small for avatar uploads (POST /api/users/me/avatar)
    client_max_body_size 5m;

    # Don't advertise the exact nginx version in every response.
    server_tokens off;

    # --- Security headers -------------------------------------------------
    # Declared at server level so every location inherits them. Careful: nginx
    # add_header inheritance is all-or-nothing — the day a location{} below
    # needs its own add_header, it silently drops ALL of these and they must be
    # repeated there. `always` so they're sent on error responses (404/502) too.
    #
    # The backend already sends its own helmet headers on /api; those responses
    # end up carrying both sets. That's harmless: /api only returns JSON and
    # images, where CSP is inert. The SPA document (location /) is served by the
    # frontend container, which sets none — so it gets exactly this CSP.

    # 1 year, subdomains included. Both saveboxd.com and www. are HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing embeds this app; frame-ancestors below is the modern equivalent,
    # X-Frame-Options is kept for older browsers that ignore CSP.
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Deliberately NO Cross-Origin-Embedder-Policy: it would block the
    # cross-origin avatars (Google/Discord/Steam CDNs) loaded by the SPA.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # CSP tuned to what the SPA actually loads. Every allowance below was checked
    # against the compiled bundle and confirmed with a report-only run in a real
    # headless Chrome, not inferred from the source:
    #   script-src 'self'   the Vite build emits no inline <script>, and no
    #                       eval()/new Function() — so no 'unsafe-inline', no
    #                       'unsafe-eval'.
    #   style-src  'self'   deliberately WITHOUT 'unsafe-inline': style-src only
    #                       governs <style> blocks and style="" attributes in
    #                       markup. GSAP and React's style={} both write through
    #                       the CSSOM (element.style.…), which CSP does not
    #                       police. Confirmed: zero violations over six routes.
    #                       Nothing here injects <style> either — no CSS-in-JS
    #                       dependency and no dangerouslySetInnerHTML anywhere.
    #   font-src   'self'   @fontsource-variable/sora is self-hosted; the built
    #                       CSS only references /assets/*.woff2.
    #   img-src    data:    the 2FA QR code is a data: URL from qrcode.toDataURL
    #              blob:    avatar/cover preview via URL.createObjectURL
    #              igdb     game covers render straight from the CDN (only the
    #                       colour-extraction path goes through /igdb/)
    #              provider CDNs  avatarUrl adopted at OAuth signup points at
    #                             Google / Discord / Steam, not at our uploads
    #   connect-src wss:    Socket.IO (presence, chat, notifications)
    #              monitoring.saveboxd.com  frontend error reports
    #                       (@sentry/react -> self-hosted GlitchTip)
    #   worker-src 'none'   the bundle creates no Worker of any kind
    #   frame-src  kuula.co panorama-guess embeds their official 360° viewer
    #                       iframe (kuula.co/share/<id>) instead of hosting the
    #                       panorama ourselves
    # DeepL and MyMemory need no entry: translation is called server-side from
    # translation.service.ts, the browser never talks to them.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src https://kuula.co; worker-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://images.igdb.com https://*.googleusercontent.com https://cdn.discordapp.com https://*.steamstatic.com; font-src 'self'; connect-src 'self' wss://saveboxd.com https://monitoring.saveboxd.com; upgrade-insecure-requests" always;
    # ----------------------------------------------------------------------

    # REST API -> NestJS
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Images IGDB re-servies en même origine : le CDN n'envoie pas de header
    # CORS, or l'extraction de couleur dominante lit les pixels en canvas —
    # interdit sur une image cross-origin ("tainted canvas")
    location /igdb/ {
        proxy_pass https://images.igdb.com/;
        proxy_set_header Host images.igdb.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
    }

    # WebSockets (presence, chat, notifications)
    location /socket.io {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # default 60s would kill an idle WS; Socket.IO pings every 25s but
        # a missed ping (laptop sleep, GC pause) must not drop the socket
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Shareable pages: a known crawler gets the server-rendered OG meta/image
    # instead of the SPA shell. Real browsers (and everything else) fall
    # through to the normal static SPA below, untouched.
    location ~ ^/(game|company)/[0-9]+/?$ {
        if ($og_bot) {
            proxy_pass http://backend:3000$og_path$is_args$args;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    location ~ ^/u/[^/]+/?$ {
        if ($og_bot) {
            proxy_pass http://backend:3000$og_path$is_args$args;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    location = /games {
        if ($og_bot) {
            proxy_pass http://backend:3000$og_path$is_args$args;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Homepage: exact match only, so every other route still falls through
    # to the catch-all below untouched.
    location = / {
        if ($og_bot) {
            proxy_pass http://backend:3000$og_path$is_args$args;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Everything else -> static SPA bundle
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}

# GlitchTip dashboard (error monitoring) — private, not linked from the app.
# Same certificate as saveboxd.com (issued with monitoring.saveboxd.com as an
# extra SAN, see deploy/init-letsencrypt.sh), so no separate cert path.
server {
    listen 443 ssl;
    http2 on;
    server_name monitoring.saveboxd.com;

    ssl_certificate     /etc/letsencrypt/live/saveboxd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saveboxd.com/privkey.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://glitchtip-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
