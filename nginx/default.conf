# HTTPS reverse proxy — the only entry point of the application.
# Browser (https://localhost:8443) -> nginx -> backend / frontend (plain HTTP
# inside the docker network, which is allowed by the subject).

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Default 1MB is too small for avatar uploads (POST /api/users/me/avatar)
    client_max_body_size 5m;

    # REST API -> NestJS
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets (online presence now; chat / notifications land here too later)
    # Images IGDB re-servies en même origine : le CDN n'envoie pas de header
    # CORS, or l'extraction de couleur dominante lit les pixels en canvas —
    # interdit sur une image cross-origin ("tainted canvas")
    location /igdb/ {
        proxy_pass https://images.igdb.com/;
        proxy_set_header Host images.igdb.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
    }

    location /socket.io {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # default 60s would kill an idle WS; Socket.IO pings every 25s but
        # a missed ping (laptop sleep, GC pause) must not drop the socket
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else -> Vite dev server (with HMR websocket support)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
