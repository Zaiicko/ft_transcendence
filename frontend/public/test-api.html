<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameLog — test API reviews</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 860px; margin: 0 auto; padding: 24px 16px 80px;
      background: #14181c; color: #cdd6de;
    }
    h1 { font-size: 1.3rem; color: #fff; }
    h1 small { color: #678; font-weight: normal; font-size: 0.8rem; }
    fieldset {
      border: 1px solid #2c3440; border-radius: 8px;
      margin: 0 0 16px; padding: 12px 16px;
    }
    legend { color: #8ea4b8; font-size: 0.85rem; padding: 0 6px; }
    label { font-size: 0.8rem; color: #8ea4b8; display: block; margin: 8px 0 2px; }
    input, textarea, select {
      width: 100%; padding: 7px 10px; border-radius: 6px;
      border: 1px solid #2c3440; background: #1b2129; color: #e8eef4;
      font: inherit;
    }
    input[type="number"] { width: 90px; }
    textarea { resize: vertical; min-height: 50px; }
    button {
      margin-top: 10px; padding: 7px 14px; border: 0; border-radius: 6px;
      background: #00ac1c; color: #fff; font: inherit; cursor: pointer;
    }
    button.secondary { background: #2c3440; }
    /* green = the current user's own reaction */
    button.mine { background: #00ac1c; color: #fff; }
    button.small { margin: 0; padding: 2px 9px; font-size: 0.78rem; }
    button:hover { filter: brightness(1.15); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .row > div { flex: 1; min-width: 130px; }

    .review {
      border: 1px solid #2c3440; border-radius: 8px;
      padding: 12px 14px; margin: 10px 0; background: #1b2129;
    }
    .review .head { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #2c3440;
      display: flex; align-items: center; justify-content: center;
      color: #8ea4b8; font-weight: bold; flex-shrink: 0;
      object-fit: cover; /* quand .avatar est un <img> */
    }
    .avatar.sm {
      width: 18px; height: 18px; font-size: 0.6rem;
      display: inline-flex; vertical-align: middle; margin-right: 5px;
    }
    .review .title { font-weight: bold; color: #fff; }
    .review .meta { font-size: 0.75rem; color: #678; }
    .rating {
      margin-left: auto; background: #2c3440; color: #ffd700;
      border-radius: 6px; padding: 3px 9px; font-weight: bold; flex-shrink: 0;
    }
    .review .text { margin: 8px 0 6px; white-space: pre-wrap; }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .comment { border-left: 2px solid #2c3440; margin: 8px 0 0 16px; padding: 6px 0 0 12px; }
    .comment .text { margin: 3px 0; }

    #log {
      background: #0d1117; border: 1px solid #2c3440; border-radius: 8px;
      padding: 12px; font-family: ui-monospace, monospace; font-size: 0.75rem;
      white-space: pre-wrap; word-break: break-all;
      max-height: 260px; overflow-y: auto;
    }
    #log .req { color: #58a6ff; }
    #log .ok { color: #3fb950; }
    #log .err { color: #f85149; }

    #gameCard .game-head {
      display: flex; gap: 16px; margin: 0 0 16px;
      border: 1px solid #2c3440; border-radius: 8px;
      padding: 14px; background: #1b2129;
    }
    #gameCard img { width: 96px; border-radius: 6px; align-self: flex-start; }
    #gameCard .title { font-size: 1.15rem; font-weight: bold; color: #fff; }
    #gameCard .meta { font-size: 0.8rem; color: #8ea4b8; margin-top: 3px; }
    #gameCard .igdb { color: #ffd700; }
    #gameCard a { color: #fff; text-decoration: underline dotted #678; }
    #gameCard a:hover { color: #00ac1c; }
    #gameCard .text { margin-top: 8px; font-size: 0.85rem; }
    #searchResults { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .search-card {
      display: flex; gap: 8px; align-items: center; cursor: pointer;
      border: 1px solid #2c3440; border-radius: 6px; padding: 6px 10px;
      background: #1b2129; max-width: 260px;
    }
    .search-card:hover { border-color: #00ac1c; }
    .search-card img { width: 32px; border-radius: 3px; }
    .search-card .t { font-size: 0.85rem; color: #e8eef4; }
    .search-card .meta { font-size: 0.72rem; color: #678; }

    .top-games { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .top-game { flex: 0 0 92px; cursor: pointer; text-align: center; }
    .top-game img { width: 92px; height: 123px; object-fit: cover; border-radius: 6px; }
    .top-game .score { color: #ffd700; font-weight: bold; font-size: 0.85rem; }
    .top-game .t {
      font-size: 0.72rem; color: #8ea4b8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .hl-card {
      border: 1px solid #2c3440; border-radius: 8px; background: #1b2129;
      padding: 10px 12px; cursor: pointer; display: flex; gap: 10px;
    }
    .hl-card:hover { border-color: #00ac1c; }
    .hl-card img { width: 48px; border-radius: 4px; align-self: flex-start; }
    .hl-card .t { font-weight: bold; color: #fff; font-size: 0.85rem; }
    .hl-card .meta { font-size: 0.72rem; color: #678; margin-top: 2px; }
    .hl-card .excerpt {
      font-size: 0.8rem; margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>🎮 GameLog — test API reviews <small>page de dev, hors app React</small></h1>

  <fieldset id="authBox">
    <legend>Compte (vrai auth — JWT en cookie httpOnly)</legend>
    <div id="loggedOut">
      <div class="row">
        <div><label>Email</label><input id="authEmail" placeholder="toi@test.com"></div>
        <div><label>Username (signup)</label><input id="authUsername" placeholder="toi"></div>
        <div><label>Mot de passe</label><input id="authPassword" type="password"></div>
        <div><button onclick="doAuth('login')">Login</button></div>
        <div><button class="secondary" onclick="doAuth('signup')">Signup</button></div>
      </div>
    </div>
    <div id="loggedIn" style="display:none">
      <span id="whoami"></span>
      <button class="small secondary" onclick="doLogout()">Se déconnecter</button>
    </div>
  </fieldset>

  <fieldset id="homeBox">
    <legend>Accueil — populaires du moment</legend>
    <div id="topGames" class="top-games"></div>
    <div id="highlights" class="hl-grid"></div>
    <button id="hlMore" class="secondary" style="display:none"
            onclick="showMoreHighlights()">Voir plus d'avis</button>
  </fieldset>

  <fieldset>
    <legend>Jeu</legend>
    <div class="row">
      <div><label>Game id ciblé</label><input id="gameId" type="number" value="1" onchange="openGame(Number(this.value))"></div>
      <div><label>Rechercher un jeu</label><input id="gameSearch" placeholder="elden… (Entrée)"
           onkeydown="if(event.key==='Enter') searchGames(this.value)"></div>
      <div><button class="secondary" onclick="randomGame()">🎲 Jeu au hasard</button></div>
    </div>
    <div id="searchResults"></div>
  </fieldset>

  <div id="gameCard"></div>

  <fieldset id="postForm">
    <legend>Poster une review</legend>
    <label>Titre</label><input id="rvTitle" placeholder="Banger sur banger">
    <div class="row">
      <div><label>Note /10</label><input id="rvRating" type="number" min="0" max="10" value="8"></div>
    </div>
    <label>Texte</label><textarea id="rvText" placeholder="Ton avis…"></textarea>
    <button onclick="createReview()">Publier</button>
  </fieldset>

  <fieldset>
    <legend>Reviews du jeu
      <select id="sort" onchange="loadReviews()">
        <option value="recent">récentes</option>
        <option value="popular">populaires (score net 👍-👎)</option>
        <option value="discussed">💬 plus discutées</option>
      </select>
    </legend>
    <div id="reviews"><em>Clique « Charger les reviews »</em></div>
  </fieldset>

  <fieldset>
    <legend>Journal des requêtes HTTP</legend>
    <div id="log"></div>
  </fieldset>

<!-- Served by the backend itself via nginx's /socket.io route -->
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function logLine(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  $('log').prepend(div);
}

// Wrapper unique autour de fetch : ajoute le header d'auth stub,
// journalise requête/réponse, parse le JSON quand il y en a un.
async function api(method, path, body, silent = false) {
  logLine('req', `${method} ${path}` + (body ? ' ' + JSON.stringify(body) : ''));
  // The httpOnly cookie rides along automatically (same origin) — no header
  const res = await fetch('/api' + path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  logLine(res.ok ? 'ok' : 'err', `HTTP ${res.status}` + (text ? ' ' + text : ''));
  if (!res.ok) {
    if (!silent) alert(`Erreur ${res.status} : ${data?.message ?? res.statusText}`);
    throw new Error(res.status);
  }
  return data;
}

let shownGameId = null;

// Current session, fetched once via the cookie; null = anonymous browsing
let me = null;

async function refreshSession() {
  me = await api('GET', '/auth/me', null, true).catch(() => null);
  $('loggedOut').style.display = me ? 'none' : '';
  $('loggedIn').style.display = me ? '' : 'none';
  if (me) $('whoami').textContent = `Connecté : ${me.username} (id ${me.id}) `;
}

async function doAuth(mode) {
  const body = { email: $('authEmail').value, password: $('authPassword').value };
  if (mode === 'signup') body.username = $('authUsername').value;
  await api('POST', `/auth/${mode}`, body);
  await refreshSession();
  loadReviews();
}

async function doLogout() {
  await api('POST', '/auth/logout');
  await refreshSession();
  loadReviews();
}

// What the reviews section is currently about: a game page or a studio page
let target = { type: 'game', id: null };

function reviewsPath() {
  return `/${target.type === 'game' ? 'games' : 'companies'}/${target.id}/reviews`;
}

// push=false when restoring from browser history (back/forward or deep link):
// pushing again there would corrupt the history stack
function openCompany(id, push = true) {
  target = { type: 'company', id };
  if (push) history.pushState(null, '', `#company-${id}`);
  loadReviews();
}

function openGame(id, push = true) {
  target = { type: 'game', id };
  $('gameId').value = id;
  if (push) history.pushState(null, '', `#game-${id}`);
  loadReviews();
}

// Browser back/forward fire popstate — restore the target the hash describes
function applyHash() {
  const m = location.hash.match(/^#(game|company)-(\d+)$/);
  if (!m) return false;
  m[1] === 'game' ? openGame(Number(m[2]), false) : openCompany(Number(m[2]), false);
  return true;
}
window.addEventListener('popstate', applyHash);

async function loadTarget() {
  if (target.type === 'company') return loadCompany();
  const box = $('gameCard');
  const game = await api('GET', `/games/${target.id}`, null, true).catch(() => null);
  if (!game) {
    box.innerHTML = `
      <div class="game-head"><div>
        <div class="title">Jeu #${esc(String(target.id))} introuvable</div>
        <div class="meta">Cet id n'existe pas dans ta base locale (les ids dépendent de
        l'ordre des imports). Utilise la recherche ou 🎲.</div>
      </div></div>`;
    return;
  }
  const year = game.releaseDate ? new Date(game.releaseDate).getFullYear() : '?';
  // Studio names are links to the studio page (its games + its reviews)
  const studios = game.companies.map((c) =>
    `<a href="#" onclick="openCompany(${c.id}); return false">${esc(c.name)}</a>`,
  ).join(' · ');
  box.innerHTML = `
    <div class="game-head">
      ${game.coverUrl ? `<img src="${esc(game.coverUrl)}" alt="cover" onerror="this.remove()">` : ''}
      <div>
        <div class="title">${esc(game.title)} <span class="meta">(${year})</span></div>
        <div class="meta">${studios || 'studio inconnu'}</div>
        <div class="meta">${game.genres.map((g) => esc(g.name)).join(', ')}</div>
        <div class="meta igdb" id="userScore"></div>
        ${game.igdbRating ? `<div class="meta igdb">★ IGDB ${game.igdbRating.toFixed(1)}/100 (${game.igdbRatingCount ?? 0} votes)</div>` : ''}
        ${game.summary ? `<div class="text">${esc(game.summary)}</div>` : ''}
      </div>
    </div>`;
}

async function loadCompany() {
  const box = $('gameCard');
  const c = await api('GET', `/companies/${target.id}`, null, true).catch(() => null);
  if (!c) { box.innerHTML = '<div class="game-head"><div class="title">Studio introuvable</div></div>'; return; }
  const gamesGrid = c.games.map((g) =>
    `<div class="search-card" onclick="openGame(${g.id})">
      ${g.coverUrl ? `<img src="${esc(g.coverUrl)}" alt="">` : ''}
      <div><div class="t">${esc(g.title)}</div>
      <div class="meta">${g.releaseDate ? new Date(g.releaseDate).getFullYear() : '?'}</div></div>
    </div>`,
  ).join('');
  box.innerHTML = `
    <div class="game-head">
      ${c.logoUrl ? `<img src="${esc(c.logoUrl)}" alt="logo" onerror="this.remove()">` : ''}
      <div style="flex:1">
        <div class="title">🏢 ${esc(c.name)}</div>
        <div class="meta">${c._count.games} jeux · ${c._count.reviews} reviews du studio</div>
        <div class="meta igdb" id="userScore"></div>
        <div id="companyGames" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${gamesGrid}</div>
      </div>
    </div>`;
}

// igdb=true: pressing Enter is the "explicit user action" the games module
// wants for its on-demand IGDB import — missing games get added to our DB
async function searchGames(term) {
  if (!term.trim()) return;
  const { data } = await api('GET', `/games/search?q=${encodeURIComponent(term)}&igdb=true`);
  const box = $('searchResults');
  box.innerHTML = data.length ? '' : '<em>Aucun jeu trouvé</em>';
  for (const g of data) {
    const card = document.createElement('div');
    card.className = 'search-card';
    const year = g.releaseDate ? new Date(g.releaseDate).getFullYear() : '?';
    card.innerHTML = `
      ${g.coverUrl ? `<img src="${esc(g.coverUrl)}" alt="" onerror="this.remove()">` : ''}
      <div>
        <div class="t">${esc(g.title)} <span class="meta">(${year})</span></div>
        <div class="meta">${g.companies?.map((c) => esc(c.name)).join(' · ') ?? ''}</div>
      </div>`;
    card.onclick = () => { box.innerHTML = ''; openGame(g.id); };
    box.appendChild(card);
  }
}

// Uniform random pick using the existing paginated list: total count first,
// then one game at a random offset — no dedicated backend endpoint needed
async function randomGame() {
  const { total } = await api('GET', '/games?limit=1');
  if (!total) return;
  const page = 1 + Math.floor(Math.random() * total);
  const { data } = await api('GET', `/games?page=${page}&limit=1`);
  if (data[0]) openGame(data[0].id);
}

async function createReview() {
  await api('POST', reviewsPath(), {
    title: $('rvTitle').value,
    rating: Number($('rvRating').value),
    text: $('rvText').value,
  });
  // Clear only on success (a thrown 4xx above skips this, inputs are kept)
  $('rvTitle').value = '';
  $('rvText').value = '';
  $('rvRating').value = 8;
  loadReviews();
}

async function refreshUserScore() {
  const el = $('userScore');
  if (!el) return;
  const stats = await api('GET', `${reviewsPath()}/stats`, null, true).catch(() => null);
  if (!stats) return;
  el.textContent = stats._count
    ? `⭐ Users ${stats._avg.rating.toFixed(1)}/10 (${stats._count} avis)`
    : '⭐ Users — pas encore d\'avis';
}

// ---- Temps réel : la room du jeu affiché nous pousse ses évènements ----
const socket = io(); // même origine, handshake sur /socket.io (proxifié par nginx)

socket.on('connect', () => {
  logLine('ok', `WS connecté (${socket.id})`);
  joinTargetRoom(); // re-join après une reconnexion automatique
});
socket.on('disconnect', () => logLine('err', 'WS déconnecté — reconnexion auto…'));

// Structural changes -> full reload; reactions/comments -> targeted DOM
// updates only (avoids rebuilding — and flashing — the whole list)
for (const ev of ['review:created', 'review:updated', 'review:deleted']) {
  socket.on(ev, (payload) => {
    logLine('req', `WS ${ev} ${JSON.stringify(payload ?? '')}`);
    loadReviews();
  });
}
// Reactions carry the fresh counts: patch the two buttons' text in place —
// no node is destroyed, so nothing can flash and no scroll anchor is lost
socket.on('review:reaction', ({ reviewId, likes, dislikes }) => {
  logLine('req', `WS review:reaction {"reviewId":${reviewId}}`);
  const like = document.querySelector(`[data-rlike="${reviewId}"]`);
  if (!like) return; // review not on screen
  like.textContent = `👍 ${likes}`;
  document.querySelector(`[data-rdislike="${reviewId}"]`).textContent = `👎 ${dislikes}`;
});
// A comment can be rendered twice (⭐ top comment + open thread): patch all
socket.on('comment:reaction', ({ reviewId, commentId, likes, dislikes }) => {
  logLine('req', `WS comment:reaction {"commentId":${commentId}}`);
  document.querySelectorAll(`[data-clike="${commentId}"]`)
    .forEach((b) => { b.textContent = `👍 ${likes}`; });
  document.querySelectorAll(`[data-cdislike="${commentId}"]`)
    .forEach((b) => { b.textContent = `👎 ${dislikes}`; });
});
socket.on('comment:changed', ({ reviewId }) => {
  logLine('req', `WS comment:changed {"reviewId":${reviewId}}`);
  refreshReviewCard(reviewId); // 💬 count on the card
  if (openComs.has(reviewId)) showComments(reviewId);
});

// Removing DOM nodes above the reader breaks the browser's scroll anchoring
// and yanks the page to the top — snapshot scrollY around every swap
function keepScroll(mutate) {
  const y = window.scrollY;
  mutate();
  window.scrollTo(0, y);
}

// Replace one review card in place, keeping its (stateful) thread boxes
async function refreshReviewCard(reviewId) {
  const old = document.getElementById(`review-${reviewId}`);
  if (!old) return loadReviews();
  const r = await api('GET', `/reviews/${reviewId}`, null, true).catch(() => null);
  if (!r) return loadReviews(); // deleted meanwhile
  const fresh = renderReview(r);
  keepScroll(() => {
    // move the live thread container into the new card instead of resetting it
    fresh.querySelector(`#coms-${reviewId}`).replaceWith(old.querySelector(`#coms-${reviewId}`));
    old.replaceWith(fresh);
  });
}

function joinTargetRoom() {
  if (socket.connected && target.id) socket.emit(`${target.type}:join`, Number(target.id));
}

// Serialized: overlapping reloads (own action + WS event landing together)
// would interleave their renders and duplicate DOM — run one at a time,
// remember at most one pending re-run
let reloading = false;
let reloadPending = false;
async function loadReviews() {
  if (reloading) { reloadPending = true; return; }
  reloading = true;
  try {
    await refreshReviews();
  } finally {
    reloading = false;
    if (reloadPending) { reloadPending = false; loadReviews(); }
  }
}

async function refreshReviews() {
  // Typing in the game-id field always means "back to a game page"
  if (target.type === 'game') target.id = Number($('gameId').value);
  const key = `${target.type}:${target.id}`;
  if (key !== shownGameId) {
    shownGameId = key;
    openComs.clear();
    openReplies.clear();
    await loadTarget(); // awaited so #userScore exists before we fill it
    joinTargetRoom();
  }
  const reviews = await api('GET', `${reviewsPath()}?sort=${$('sort').value}`);
  refreshUserScore();
  const root = $('reviews');
  keepScroll(() => {
    root.innerHTML = reviews.length ? '' : '<em>Aucune review sur ce jeu</em>';
    for (const r of reviews) root.appendChild(renderReview(r));
  });
  // Hidden when anonymous or already reviewed (UX only; the real enforcement
  // is the 401 guard and the 409 unique constraint server-side)
  $('postForm').style.display =
    me && !reviews.some((r) => r.user?.id === me.id) ? '' : 'none';
  // Re-open the threads the user had expanded before this re-render
  for (const id of [...openComs]) showComments(id);
}

// Vraie photo si l'utilisateur en a une, sinon l'initiale du username.
// user null = compte supprimé (le contenu reste, anonymisé)
function avatar(user, sm = false) {
  const cls = sm ? 'avatar sm' : 'avatar';
  if (!user) return `<div class="${cls}">✕</div>`;
  return user.avatarUrl
    ? `<img class="${cls}" src="${esc(user.avatarUrl)}" alt="">`
    : `<div class="${cls}">${esc(user.username[0].toUpperCase())}</div>`;
}

function authorName(user) {
  return user ? esc(user.username) : '<em>[utilisateur supprimé]</em>';
}

function renderReview(r) {
  const el = document.createElement('div');
  el.className = 'review';
  el.id = `review-${r.id}`;
  el.innerHTML = `
    <div class="head">
      ${avatar(r.user)}
      <div>
        ${r.title ? `<div class="title">${esc(r.title)}</div>` : ''}
        <div class="meta">${authorName(r.user)} · ${new Date(r.createdAt).toLocaleDateString('fr')}</div>
      </div>
      <div class="rating">${r.rating}/10</div>
    </div>
    ${r.text ? `<div class="text">${esc(r.text)}</div>` : ''}
    <div class="actions">
      <button class="small secondary ${r.myReaction === 'like' ? 'mine' : ''}"
              data-rlike="${r.id}" onclick="react(${r.id}, 'like', this)">👍 ${r._count.likes}</button>
      <button class="small secondary ${r.myReaction === 'dislike' ? 'mine' : ''}"
              data-rdislike="${r.id}" onclick="react(${r.id}, 'dislike', this)">👎 ${r._count.dislikes}</button>
      <button class="small secondary" onclick="toggleComments(${r.id}, this)">💬 ${r._count.comments} coms</button>
      ${me && r.user?.id === me.id
        ? `<button class="small secondary" onclick="delReview(${r.id})">🗑️ ma review</button>` : ''}
    </div>
    <div id="coms-${r.id}"></div>`;
  return el;
}

// Toggle: clicking your own reaction removes it. Counts arrive via the WS
// event; the green "mine" state is patched locally right away.
async function react(id, type, btn) {
  const mine = btn.classList.contains('mine');
  await api(mine ? 'DELETE' : 'POST', `/reviews/${id}/${type}`);
  document.querySelector(`[data-rlike="${id}"]`)
    ?.classList.toggle('mine', !mine && type === 'like');
  document.querySelector(`[data-rdislike="${id}"]`)
    ?.classList.toggle('mine', !mine && type === 'dislike');
  // WS down: the review:reaction event won't come — refresh just this card
  // (full loadReviews would collapse open threads and make the page jump)
  if (!socket.connected) refreshReviewCard(id);
}
async function delReview(id) {
  if (confirm('Supprimer cette review ?')) { await api('DELETE', `/reviews/${id}`); loadReviews(); }
}

async function delCom(id) {
  if (!confirm('Supprimer ce commentaire (et toutes ses réponses) ?')) return;
  await api('DELETE', `/comments/${id}`);
  if (!socket.connected) loadReviews();
}

// Open threads survive re-renders: every full reload re-opens what's in
// these sets instead of collapsing everything
const openComs = new Set();
const openReplies = new Set();
// Staleness guards: each fetch gets a generation number; if a newer fetch
// (or a close) happened while this one was in flight, its result is dropped
const comsGen = new Map();
const repliesGen = new Map();

async function toggleComments(reviewId) {
  if (openComs.has(reviewId)) {
    openComs.delete(reviewId);
    $(`coms-${reviewId}`).innerHTML = '';
    return;
  }
  openComs.add(reviewId);
  await showComments(reviewId);
}

async function showComments(reviewId) {
  if (!$(`coms-${reviewId}`)) { openComs.delete(reviewId); return; } // review disparue
  const gen = (comsGen.get(reviewId) ?? 0) + 1;
  comsGen.set(reviewId, gen);
  const comments = await api('GET', `/reviews/${reviewId}/comments?sort=top`);
  const box = $(`coms-${reviewId}`); // re-query: a re-render may have replaced it
  if (!box || comsGen.get(reviewId) !== gen || !openComs.has(reviewId)) return;
  box.innerHTML = '';
  for (const c of comments) {
    box.appendChild(renderComment(c, reviewId, 0));
    if (openReplies.has(c.id)) showReplies(c.id, reviewId, 1);
  }
  const form = document.createElement('div');
  form.className = 'comment';
  form.innerHTML = `
    <input placeholder="Ajouter un commentaire…"
           onkeydown="if(event.key==='Enter') postComment(${reviewId}, null, this)">`;
  box.appendChild(form);
}

async function showReplies(commentId, reviewId, depth) {
  if (!$(`replies-${commentId}`)) { openReplies.delete(commentId); return; }
  const gen = (repliesGen.get(commentId) ?? 0) + 1;
  repliesGen.set(commentId, gen);
  const replies = await api('GET', `/comments/${commentId}/replies`);
  const box = $(`replies-${commentId}`);
  if (!box || repliesGen.get(commentId) !== gen || !openReplies.has(commentId)) return;
  box.innerHTML = '';
  for (const r of replies) {
    box.appendChild(renderComment(r, reviewId, depth));
    if (openReplies.has(r.id)) showReplies(r.id, reviewId, depth + 1);
  }
}

// Mirrors the server-side MAX_REPLY_DEPTH — the API rejects deeper replies
// anyway, this only hides the button that would trigger a 400
const MAX_REPLY_DEPTH = 3;

function renderComment(c, reviewId, depth = 0) {
  const el = document.createElement('div');
  el.className = 'comment';
  // Tombale Reddit-style : auteur et texte effacés, réponses conservées
  if (c.deleted) {
    el.innerHTML = `
      <div class="meta">${avatar(null, true)}<em>[supprimé]</em></div>
      <div class="text"><em style="color:#678">Commentaire supprimé par son auteur</em></div>
      <div class="actions">
        ${c._count.replies && !openReplies.has(c.id) ? `<button class="small secondary"
                onclick="loadReplies(${c.id}, ${reviewId}, ${depth}, this)">▼ ${c._count.replies} réponses</button>` : ''}
      </div>
      <div id="replies-${c.id}"></div>`;
    return el;
  }
  el.innerHTML = `
    <div class="meta">${avatar(c.user, true)}${authorName(c.user)}</div>
    <div class="text">${esc(c.text)}</div>
    <div class="actions">
      <button class="small secondary ${c.myReaction === 'like' ? 'mine' : ''}"
              data-clike="${c.id}" onclick="reactCom(${c.id}, 'like', ${reviewId}, this)">👍 ${c._count.likes}</button>
      <button class="small secondary ${c.myReaction === 'dislike' ? 'mine' : ''}"
              data-cdislike="${c.id}" onclick="reactCom(${c.id}, 'dislike', ${reviewId}, this)">👎 ${c._count.dislikes}</button>
      ${depth < MAX_REPLY_DEPTH ? `<button class="small secondary reply-btn"
              onclick="replyBox(${c.id}, ${reviewId}, this)">↩ répondre</button>` : ''}
      ${c._count.replies && !openReplies.has(c.id) ? `<button class="small secondary"
              onclick="loadReplies(${c.id}, ${reviewId}, ${depth}, this)">▼ ${c._count.replies} réponses</button>` : ''}
      ${me && c.user?.id === me.id
        ? `<button class="small secondary" onclick="delCom(${c.id})">🗑️</button>` : ''}
    </div>
    <div id="replies-${c.id}"></div>`;
  return el;
}

async function loadReplies(commentId, reviewId, depth, btn) {
  openReplies.add(commentId);
  await showReplies(commentId, reviewId, depth + 1);
  btn.remove();
}

function replyBox(parentId, reviewId, btn) {
  closeReplyBoxes(); // one reply box at a time
  const input = document.createElement('input');
  input.className = 'reply-input';
  input.placeholder = 'Ta réponse… (Entrée pour envoyer, clic ailleurs pour annuler)';
  input.onkeydown = (e) => { if (e.key === 'Enter') postComment(reviewId, parentId, input); };
  btn.parentElement.after(input);
  input.focus();
}

function closeReplyBoxes() {
  document.querySelectorAll('.reply-input').forEach((el) => el.remove());
}

// Click anywhere outside the reply input (or its opening button) closes it.
// This runs on bubble: the opening click's target is the .reply-btn, so the
// guard below keeps the box it just created.
document.addEventListener('click', (e) => {
  if (e.target.closest('.reply-input, .reply-btn')) return;
  closeReplyBoxes();
});

async function postComment(reviewId, parentId, input) {
  if (!input.value.trim()) return;
  const body = { text: input.value };
  if (parentId) { body.parentId = parentId; openReplies.add(parentId); }
  openComs.add(reviewId);
  await api('POST', `/reviews/${reviewId}/comments`, body);
  // WS down: mimic the comment:changed handler (💬 count + fresh thread)
  if (!socket.connected) { await refreshReviewCard(reviewId); showComments(reviewId); }
}

async function reactCom(id, type, reviewId, btn) {
  const mine = btn.classList.contains('mine');
  await api(mine ? 'DELETE' : 'POST', `/comments/${id}/${type}`);
  // a comment can be rendered twice (⭐ + open thread) — patch every instance
  document.querySelectorAll(`[data-clike="${id}"]`)
    .forEach((b) => b.classList.toggle('mine', !mine && type === 'like'));
  document.querySelectorAll(`[data-cdislike="${id}"]`)
    .forEach((b) => b.classList.toggle('mine', !mine && type === 'dislike'));
  // WS down: re-render just this thread, not the whole review list
  if (!socket.connected && openComs.has(reviewId)) showComments(reviewId);
}

// ---- Accueil : jeux populaires (score bayésien du module games) + avis
// les plus likés du site (endpoint highlights). Un seul fetch de 30 avis,
// révélés 6 par 6 (3 rangées de 2) côté client. ----
let hlAll = [];
let hlShown = 0;
const HL_STEP = 6;

async function loadHome() {
  const [games, reviews] = await Promise.all([
    api('GET', '/games?sort=popular&limit=6', null, true).catch(() => null),
    api('GET', '/reviews/highlights?limit=30', null, true).catch(() => null),
  ]);
  if (games) {
    $('topGames').innerHTML = '';
    for (const g of games.data) {
      const el = document.createElement('div');
      el.className = 'top-game';
      el.onclick = () => openGame(g.id);
      el.innerHTML = `
        ${g.coverUrl ? `<img src="${esc(g.coverUrl)}" alt="">` : ''}
        <div class="score">★ ${g.score}</div>
        <div class="t" title="${esc(g.title)}">${esc(g.title)}</div>`;
      $('topGames').appendChild(el);
    }
  }
  hlAll = reviews ?? [];
  hlShown = 0;
  $('highlights').innerHTML = hlAll.length ? '' : '<em>Aucun avis récent</em>';
  showMoreHighlights();
}

function showMoreHighlights() {
  for (const r of hlAll.slice(hlShown, hlShown + HL_STEP)) {
    $('highlights').appendChild(renderHighlight(r));
  }
  hlShown = Math.min(hlShown + HL_STEP, hlAll.length);
  $('hlMore').style.display = hlShown < hlAll.length ? '' : 'none';
}

function renderHighlight(r) {
  const el = document.createElement('div');
  el.className = 'hl-card';
  // Clicking a card navigates to the game/studio page where the full
  // review (and its thread) lives
  el.onclick = () => (r.game ? openGame(r.game.id) : openCompany(r.company.id));
  const cover = r.game ? r.game.coverUrl : r.company.logoUrl;
  el.innerHTML = `
    ${cover ? `<img src="${esc(cover)}" alt="">` : ''}
    <div>
      <div class="t">${esc(r.game ? r.game.title : r.company.name)} · <span style="color:#ffd700">${r.rating}/10</span></div>
      <div class="meta">${r.title ? `« ${esc(r.title)} » — ` : ''}${avatar(r.user, true)}${authorName(r.user)}
        · 👍 ${r._count.likes} · 👎 ${r._count.dislikes} · 💬 ${r._count.comments}</div>
      <div class="excerpt">${esc(r.text ?? '')}</div>
    </div>`;
  return el;
}

// Toujours échapper le contenu utilisateur avant innerHTML (sinon XSS —
// React fera ça automatiquement, ici on est en JS "à la main")
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

window.addEventListener('DOMContentLoaded', async () => {
  await refreshSession();
  loadHome(); // indépendant de la page jeu/studio affichée en dessous
  // Deep link (#game-29 / #company-104) wins — F5 and shared URLs restore it
  if (applyHash()) return;
  // Game ids depend on each machine's seed — fall back to a random game
  // if the default id doesn't exist locally
  const exists = await api('GET', `/games/${$('gameId').value}`, null, true)
    .then(() => true).catch(() => false);
  if (exists) {
    history.replaceState(null, '', `#game-${$('gameId').value}`);
    loadReviews();
  } else {
    randomGame();
  }
});
</script>
</body>
