# Static SPA server, only reached through the reverse proxy (plain HTTP
# inside the docker network).
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles (index-CsCJXSZr.js…) are immutable: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: any unknown path falls back to index.html (react-router).
    # index.html itself must never be cached, or deploys wouldn't show up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
